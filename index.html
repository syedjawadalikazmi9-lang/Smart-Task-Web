<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Web Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Semantic Header -->
    <header>
        <h1>Smart Task Web Manager</h1>
        <p>Organize your daily tasks easily</p>
    </header>

    <!-- Semantic Main Content -->
    <main>
        <section class="form-section">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button id="addBtn" onclick="addOrUpdateTask()">Add Task</button>
        </section>

        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search tasks..." onkeyup="searchTasks()">
        </section>

        <section class="list-section">
            <ul id="taskList"></ul>
        </section>
    </main>

    <!-- Semantic Footer -->
    <footer>
        <p>&copy; 2026 SmartTask Web Assignment</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
